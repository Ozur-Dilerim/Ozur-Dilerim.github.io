<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özür Dilerim 🥺</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0b0b11;
    --surface:   #13131c;
    --surface2:  #1c1c28;
    --border:    rgba(255,80,150,0.15);
    --pink:      #ff3d8a;
    --pink2:     #c4185e;
    --glow:      rgba(255,61,138,0.4);
    --text:      #f2eaf0;
    --muted:     #8a7d90;
    --r:         22px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Ambient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  .b1 { width:500px;height:500px;background:rgba(255,61,138,.1); top:-150px;left:-150px; }
  .b2 { width:400px;height:400px;background:rgba(120,30,180,.08); bottom:-120px;right:-120px; }

  /* Floating hearts */
  .hearts-bg { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
  .hf {
    position:absolute;
    opacity:.07;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform:translateY(110vh); opacity:.07; }
    to   { transform:translateY(-10vh); opacity:0; }
  }

  /* ══════════════════════════════
     CARD
  ══════════════════════════════ */
  .card {
    position: relative;
    z-index: 10;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    width: min(440px, 92vw);
    padding: 36px 36px 32px;
    text-align: center;
    box-shadow:
      0 0 0 1px rgba(255,61,138,.05),
      0 30px 90px rgba(0,0,0,.6),
      0 0 80px rgba(255,61,138,.06);
    animation: cardIn .65s cubic-bezier(.22,1,.36,1) both;
    /* NO overflow:hidden — so stick can escape */
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(30px) scale(.95); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  /* Card shake */
  @keyframes hitShake {
    0%,100% { transform:translate(0,0) rotate(0deg); }
    15%     { transform:translate(-7px, 4px) rotate(-1.5deg); }
    30%     { transform:translate(7px,-4px) rotate(1.5deg); }
    50%     { transform:translate(-4px, 2px) rotate(-.8deg); }
    70%     { transform:translate(4px,-2px) rotate(.8deg); }
    85%     { transform:translate(-2px,1px); }
  }
  .card.shake { animation: hitShake .42s ease both; }

  /* ══════════════════════════════
     IMAGE  — round, outside overflow
  ══════════════════════════════ */
  .img-outer {
    position: relative;          /* anchor for stick & effects */
    width: 170px;
    height: 170px;
    margin: 0 auto 28px;
    /* overflow VISIBLE so stick pokes out */
  }

  .img-ring {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    overflow: hidden;            /* clips photos to circle */
    border: 3px solid rgba(255,61,138,.35);
    box-shadow:
      0 0 0 6px rgba(255,61,138,.08),
      0 10px 40px rgba(0,0,0,.5);
    position: relative;
    background: var(--surface2);
  }

  .img-ring img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .12s ease;
  }
  /* img2 starts fully hidden */
  #img2 { opacity: 0; }

  /* img bounce */
  @keyframes imgBounce {
    0%   { transform:scale(1) rotate(0deg); }
    20%  { transform:scale(.88) rotate(-6deg); }
    50%  { transform:scale(1.07) rotate(3deg); }
    75%  { transform:scale(.97) rotate(-1deg); }
    100% { transform:scale(1) rotate(0deg); }
  }
  .img-ring.bounce { animation: imgBounce .48s ease both; }

  /* Red flash inside ring */
  .img-flash {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255,40,80,.3);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
  }
  .img-flash.active { animation: flashFade .35s ease forwards; }
  @keyframes flashFade {
    0%   { opacity: .7; }
    100% { opacity: 0; }
  }

  /* ══════════════════════════════
     STICK — sits on img-outer, NOT clipped
  ══════════════════════════════ */
  .stick-wrap {
    position: absolute;
    top: -35px;
    right: -40px;
    width: 150px;
    height: 150px;
    pointer-events: none;
    z-index: 999;
    display: none;               /* hidden by default */
  }
  .stick-wrap.active { display: block; }

  .stick-svg {
    width: 140px;
    height: 140px;
    transform-origin: 90% 8%;
    display: block;
  }
  .stick-svg.swing { animation: stickSwing .5s cubic-bezier(.36,.07,.19,.97) forwards; }
  @keyframes stickSwing {
    0%   { transform: rotate(-80deg); }
    35%  { transform: rotate(35deg);  }
    55%  { transform: rotate(20deg);  }
    72%  { transform: rotate(30deg);  }
    100% { transform: rotate(-80deg); }
  }

  /* ══════════════════════════════
     HIT EFFECTS (outside ring, on img-outer)
  ══════════════════════════════ */
  .hit-stars {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
    z-index: 900;
    display: none;
  }
  .hit-stars span {
    position: absolute;
    font-size: 1.3rem;
    animation: starBurst .6s ease-out forwards;
    opacity: 0;
  }
  @keyframes starBurst {
    0%   { opacity:1; transform:translate(0,0) scale(1.2); }
    100% { opacity:0; transform:translate(var(--tx),var(--ty)) scale(.15); }
  }

  .bam-text {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 18px var(--pink), 2px 2px 0 var(--pink2), -1px -1px 0 var(--pink2);
    white-space: nowrap;
    pointer-events: none;
    z-index: 950;
    opacity: 0;
  }
  .bam-text.pop { animation: bamPop .7s cubic-bezier(.36,.07,.19,.97) forwards; }
  @keyframes bamPop {
    0%   { opacity:0; transform:translateX(-50%) scale(.2) rotate(-12deg); }
    30%  { opacity:1; transform:translateX(-50%) scale(1.3) rotate(5deg); }
    60%  { opacity:1; transform:translateX(-50%) scale(.97) rotate(-1deg); }
    85%  { opacity:1; transform:translateX(-50%) scale(1.02); }
    100% { opacity:0; transform:translateX(-50%) scale(1) translateY(-16px); }
  }

  /* ══════════════════════════════
     TITLE
  ══════════════════════════════ */
  .title {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.55;
    letter-spacing: -.01em;
    margin-bottom: 28px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .2s ease;
  }
  .title.fade { opacity: 0; }

  /* ══════════════════════════════
     BUTTONS
  ══════════════════════════════ */
  .btn-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-yes, .btn-no {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    letter-spacing: .01em;
    transition:
      transform .22s cubic-bezier(.34,1.56,.64,1),
      box-shadow .22s ease,
      font-size .45s cubic-bezier(.34,1.56,.64,1),
      padding .45s ease;
  }

  .btn-yes {
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    color: #fff;
    font-size: 1.05rem;
    padding: 13px 32px;
    box-shadow: 0 4px 22px var(--glow), 0 0 0 1px rgba(255,61,138,.25);
    position: relative;
    z-index: 20;
  }
  .btn-yes:hover {
    transform: scale(1.07) translateY(-2px);
    box-shadow: 0 8px 30px var(--glow);
  }

  .btn-no {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,.07);
    font-size: .95rem;
    padding: 12px 26px;
  }
  .btn-no:hover { background:#222230; color:var(--text); transform:scale(1.03); }

  /* ══════════════════════════════
     FULLSCREEN YES
  ══════════════════════════════ */
  .btn-yes.fullscreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
    font-size: 2.8rem !important;
    padding: 0 !important;
    z-index: 1000;
    animation: fillScreen .55s ease forwards;
  }
  @keyframes fillScreen {
    from { border-radius:14px; }
    to   { border-radius:0; }
  }

  /* ══════════════════════════════
     FINAL MESSAGE
  ══════════════════════════════ */
  .final-msg {
    display: none;
    font-family: 'Syne', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.75;
    letter-spacing: -.01em;
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .final-msg .hi { color: var(--pink); font-size: 1.6rem; }
  .final-msg .sig { display:block; margin-top:12px; font-family:'DM Sans',sans-serif; font-weight:400; font-size:.9rem; color:var(--muted); }
  @keyframes popIn {
    from { opacity:0; transform:scale(.8) translateY(10px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  /* ══════════════════════════════
     CONFETTI
  ══════════════════════════════ */
  .cp {
    position:fixed; width:9px; height:13px; border-radius:2px;
    opacity:0; animation:cFall 2.4s ease-in forwards;
    z-index:9999; pointer-events:none;
  }
  @keyframes cFall {
    0%   { opacity:1; transform:translateY(-20px) rotate(0deg); }
    100% { opacity:0; transform:translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="hearts-bg" id="hBg"></div>

<div class="card" id="card">

  <!-- ── IMAGE OUTER (not clipped) ── -->
  <div class="img-outer" id="imgOuter">

    <!-- Round clipped ring -->
    <div class="img-ring" id="imgRing">
      <img src="img1.jpg" id="img1" alt="">
      <img src="img2.jpg" id="img2" alt="">
      <div class="img-flash" id="imgFlash"></div>
    </div>

    <!-- Stick lives OUTSIDE the ring so it's never clipped -->
    <div class="stick-wrap" id="stickWrap">
      <svg class="stick-svg" id="stickSvg" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
        <!-- fist -->
        <ellipse cx="96" cy="22" rx="16" ry="12" fill="#FFDAB9" stroke="#c8855a" stroke-width="2"/>
        <circle cx="86" cy="16" r="8"   fill="#FFDAB9" stroke="#c8855a" stroke-width="1.5"/>
        <circle cx="97" cy="12" r="8"   fill="#FFDAB9" stroke="#c8855a" stroke-width="1.5"/>
        <circle cx="107" cy="17" r="7"  fill="#FFDAB9" stroke="#c8855a" stroke-width="1.5"/>
        <!-- stick body -->
        <rect x="52" y="18" width="13" height="82" rx="6" fill="#5a2d0c" transform="rotate(8,58,59)"/>
        <!-- grip wrap -->
        <rect x="51" y="76" width="15" height="8"  rx="3" fill="#8B4513" transform="rotate(8,58,80)"/>
        <rect x="51" y="86" width="15" height="8"  rx="3" fill="#6B3410" transform="rotate(8,58,90)"/>
        <!-- handle knob -->
        <ellipse cx="61" cy="100" rx="9" ry="6" fill="#A0522D" transform="rotate(8,61,100)"/>
      </svg>
    </div>

    <!-- Stars & BAM outside ring too -->
    <div class="hit-stars" id="hitStars"></div>
    <div class="bam-text" id="bamText">BAM! 💥</div>

  </div>
  <!-- ── END IMAGE OUTER ── -->

  <div class="title" id="mainTitle">Seni üzdüğüm için özür dilerim — ben eşeğim 🥺 Barışalım mı?</div>

  <div class="btn-row" id="btnRow">
    <button class="btn-yes" id="btnYes" onclick="handleYes()">✨ Evet</button>
    <button class="btn-no"  id="btnNo"  onclick="handleNo()">Hayır</button>
  </div>

  <div class="final-msg" id="finalMsg">
    <span class="hi">EVEETTT! 🎉</span><br>
    BİLİYORDUM BARIŞACAĞIMIZI<br>
    SENİ ÇOK ÇOK ÇOK SEVİYORUM 💖<br>
    ÖZÜR DİLERİM<br>
    <span class="sig">— Eşek Okyanus 🫏💕</span>
  </div>

</div>

<script>
/* ── Floating hearts ── */
const hBg = document.getElementById('hBg');
['💖','💕','✨','💗','🌸','💝','⭐','🌺'].forEach((e, i) => {
  for (let j = 0; j < 3; j++) {
    const d = document.createElement('div');
    d.className = 'hf';
    d.textContent = e;
    d.style.cssText = `left:${Math.random()*100}vw;font-size:${.8+Math.random()*1.2}rem;
      animation-duration:${7+Math.random()*11}s;animation-delay:${Math.random()*12}s`;
    hBg.appendChild(d);
  }
});

/* ── State ── */
let noCount = 0;
const bamWords = ['BAM! 💥','AY! 😵','VURDU! ⭐','OUF! 💫','ÇARPTIM! 🌟'];
let bamIdx = 0;

const noTexts = [
  'Hayır',
  'Emin misin?',
  'Gerçekten emin olduğuna emin misin?',
  'Son bir kez daha düşünme hakkı veriyorum güzelime 🥺',
  'Ama üzülüyorum bak... çok mu eminsin? 😢'
];
const yesSizes   = [1.05, 1.45, 1.9, 2.5, 0];
const yesPadding = ['13px 32px','16px 42px','19px 55px','23px 68px'];

/* ── Hit effect ── */
function doHitEffect() {
  const img1      = document.getElementById('img1');
  const img2      = document.getElementById('img2');
  const card      = document.getElementById('card');
  const imgRing   = document.getElementById('imgRing');
  const imgFlash  = document.getElementById('imgFlash');
  const stickWrap = document.getElementById('stickWrap');
  const stickSvg  = document.getElementById('stickSvg');
  const hitStars  = document.getElementById('hitStars');
  const bamText   = document.getElementById('bamText');

  /* 1 — Show & swing stick */
  stickWrap.classList.add('active');
  stickSvg.classList.remove('swing');
  void stickSvg.offsetWidth;          /* force reflow */
  stickSvg.classList.add('swing');

  /* 2 — Impact at ~200ms */
  setTimeout(() => {

    /* swap images */
    img1.style.opacity = '0';
    img2.style.opacity = '1';

    /* card shake */
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');

    /* ring bounce */
    imgRing.classList.remove('bounce');
    void imgRing.offsetWidth;
    imgRing.classList.add('bounce');

    /* red flash */
    imgFlash.classList.remove('active');
    void imgFlash.offsetWidth;
    imgFlash.classList.add('active');

    /* BAM text */
    bamText.textContent = bamWords[bamIdx++ % bamWords.length];
    bamText.classList.remove('pop');
    void bamText.offsetWidth;
    bamText.classList.add('pop');

    /* stars burst */
    hitStars.innerHTML = '';
    hitStars.style.display = 'block';
    const se = ['⭐','💫','✨','🌟','💥','⚡'];
    [0,55,110,165,220,275].forEach((angle, i) => {
      const s   = document.createElement('span');
      s.textContent = se[i % se.length];
      const rad = angle * Math.PI / 180;
      const d   = 70 + Math.random() * 30;
      s.style.setProperty('--tx', Math.cos(rad)*d + 'px');
      s.style.setProperty('--ty', Math.sin(rad)*d + 'px');
      s.style.animationDelay = (i * 0.025) + 's';
      hitStars.appendChild(s);
    });

  }, 200);

  /* 3 — Revert image after 1 second from impact */
  setTimeout(() => {
    img1.style.opacity = '1';
    img2.style.opacity = '0';
    imgRing.classList.remove('bounce');
    card.classList.remove('shake');
  }, 1200);

  /* 4 — Hide stick */
  setTimeout(() => {
    stickWrap.classList.remove('active');
    stickSvg.classList.remove('swing');
    hitStars.style.display = 'none';
  }, 750);
}

/* ── No handler ── */
function handleNo() {
  noCount++;
  doHitEffect();

  const btnNo  = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  const title  = document.getElementById('mainTitle');

  /* fade title, update no-btn */
  title.classList.add('fade');
  setTimeout(() => {
    if (noCount < noTexts.length) btnNo.textContent = noTexts[noCount];
    title.classList.remove('fade');
  }, 210);

  /* grow yes button */
  if (noCount <= yesSizes.length - 2) {
    btnYes.style.fontSize = yesSizes[noCount] + 'rem';
    btnYes.style.padding  = yesPadding[noCount] || yesPadding.at(-1);
  }

  /* last no → fullscreen */
  if (noCount >= 4) {
    btnNo.style.display = 'none';
    btnYes.classList.add('fullscreen');
    btnYes.textContent = '💖 Evet, Barışıyoruz! 💖';
  }
}

/* ── Yes handler ── */
function handleYes() {
  document.getElementById('btnYes').classList.remove('fullscreen');
  document.getElementById('btnRow').style.display    = 'none';
  document.getElementById('mainTitle').style.display = 'none';
  document.getElementById('imgOuter').style.display  = 'none';
  document.getElementById('finalMsg').style.display  = 'block';
  launchConfetti();
}

/* ── Confetti ── */
function launchConfetti() {
  const cols = ['#ff3d8a','#c4185e','#ff9ecf','#ffb3d9','#ff6eb4','#fff','#a855f7','#f472b6'];
  for (let i = 0; i < 140; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'cp';
      c.style.left = Math.random()*100 + 'vw';
      c.style.top  = '-20px';
      c.style.background = cols[Math.floor(Math.random()*cols.length)];
      c.style.animationDuration = (1.5 + Math.random()*1.5) + 's';
      c.style.animationDelay    = (Math.random()*.4) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }, i * 15);
  }
}
</script>
</body>
</html>
